<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threadlight</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: light-dark(#f7f6f1,#151719);
      --panel: light-dark(#fffefb,#1d2022);
      --ink: light-dark(#202a26,#e9eeea);
      --quiet: light-dark(#53605a,#aab8b0);
      --line: light-dark(#d8ded7,#353e39);
      --accent: light-dark(#176047,#8dd1ad);
      --highlight: light-dark(#e4efe7,#283b33);
      --wire: light-dark(#88988e,#82978a);
      --dependency: light-dark(#5c4c84,#c5b2f0);
      --root-fill: light-dark(#193e32,#b0dfc3);
      --root-ink: light-dark(#f8fff9,#173527);
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.58 Inter, "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    h1,h2,h3,p { margin: 0; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    header { border-bottom: 1px solid var(--line); padding: 20px clamp(14px,3.3vw,52px); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .brand { font-size: .8rem; font-weight: 640; color: var(--accent); }
    h1 { font-size: clamp(1.55rem,4vw,2rem); line-height: 1.2; letter-spacing: -.035em; }
    .header-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; font-size: .88rem; }
    .header-actions .header-control {
      display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 7px;
      border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      font: inherit; font-size: .88rem; line-height: 1.2; text-decoration: none; cursor: pointer;
    }
    .header-actions .header-control:hover { border-color: var(--accent); color: var(--accent); }
    .export-options { position: relative; }
    .export-options summary { list-style: none; }
    .export-options summary::-webkit-details-marker { display: none; }
    .export-panel { position: absolute; z-index: 2; inset-inline-end: 0; min-width: max-content; margin-top: 5px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 5px 22px #0002; }
    .export-panel button { display: block; width: 100%; text-align: left; }
    .export-panel button + button { margin-top: 5px; }
    .muted { color: var(--quiet); }
    .views { display: flex; gap: 18px; padding: 0 clamp(14px,3.3vw,52px); border-bottom: 1px solid var(--line); }
    .view-button { border: 0; border-bottom: 3px solid transparent; padding: 10px 2px 9px; background: none; color: var(--quiet); font-weight: 630; }
    .view-button:hover, .view-button[aria-current] { color: var(--accent); }
    .view-button[aria-current] { border-bottom-color: var(--accent); }
    .workspace { max-width: 1700px; margin: auto; display: grid; grid-template-columns: minmax(180px,230px) minmax(0,1fr) minmax(230px,295px); gap: 22px; padding: 24px clamp(14px,3.3vw,52px) 38px; align-items: start; }
    .workspace > * { min-width: 0; }
    .workspace[data-view="overview"] { display: block; }
    body[data-view="overview"] .header-actions .review-button { display: none; }
    body:not([data-view="process"]) .beginner { display: none; }
    .overview-heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px 14px; margin-bottom: 16px; }
    .overview-heading h2, .diagram h2, .relations h2 { font-size: clamp(1.35rem,3vw,1.8rem); line-height: 1.28; overflow-wrap: anywhere; }
    .overview-heading p { font-size: .9rem; }
    .overview-search { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px; margin-bottom: 12px; font-size: .88rem; }
    .overview-search input, .nav input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--panel); }
    .overview-search input { width: min(24rem,100%); }
    .overview-viewport { overflow: auto; max-height: max(220px, calc(100dvh - 220px)); border: 1px solid var(--line); border-radius: 13px; background: var(--panel); }
    .overview-map { position: relative; }
    .print-topology { display: none; }
    .overview-map svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .overview-wire { --overview-stroke: var(--line); color: var(--overview-stroke); fill: none; stroke: var(--overview-stroke); stroke-width: 1.25px; transition: d 150ms ease, stroke 150ms ease, opacity 150ms ease; }
    .overview-wire.expanded, .overview-wire.focused { --overview-stroke: var(--accent); }
    .overview-wire.focused { stroke-width: 2px; }
    .overview-position { position: absolute; transition: left 150ms ease, top 150ms ease, opacity 150ms ease; }
    .overview-card { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 100%; padding: 6px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); text-align: left; line-height: 1.25; }
    .overview-card:hover, .overview-card:focus-visible { border-color: var(--accent); }
    .overview-card[data-match] { border-color: var(--accent); background: var(--highlight); }
    .overview-card[data-kind="project"] { border-color: var(--root-fill); background: var(--root-fill); color: var(--root-ink); }
    .overview-card[data-kind="project"][data-match] { box-shadow: inset 0 0 0 2px var(--root-ink); }
    .overview-card[data-kind="area"] { border-color: color-mix(in srgb, var(--dependency) 50%, var(--line)); }
    .overview-card[data-kind="area"]:hover, .overview-card[data-kind="area"]:focus-visible { border-color: var(--dependency); }
    .overview-label { min-width: 0; flex: 1; }
    .overview-kind { display: block; margin-bottom: 2px; color: var(--quiet); font-size: .72rem; }
    [data-kind="project"] .overview-kind { color: inherit; }
    [data-kind="area"] .overview-kind { color: var(--dependency); }
    .overview-label strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; font-weight: 640; }
    .overview-card[data-kind="step"] strong { font-weight: 520; }
    .overview-card [data-review-text] { user-select: text; }
    .overview-expander { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 24px; color: var(--accent); font-size: .76rem; }
    .overview-expander::after { content: "▸"; }
    [aria-expanded="true"] > .overview-expander::after, .overview-expander[aria-expanded="true"]::after { content: "▾"; }
    [data-kind="project"] .overview-expander { color: inherit; }
    .overview-position[data-kind="flow"][aria-expanded] .overview-card { padding-right: 62px; }
    .overview-flow-toggle { position: absolute; top: 9px; bottom: 9px; right: 6px; min-width: 47px; padding: 0 5px; border: 0; border-left: 1px solid var(--line); border-radius: 0 5px 5px 0; background: transparent; }
    .overview-flow-toggle:hover, .overview-flow-toggle:focus-visible { background: var(--highlight); }
    .overview-state { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--quiet); }
    .overview-state.implemented { background: var(--dependency); }
    .overview-state.verified { background: var(--accent); }
    @starting-style { .overview-position, .overview-wire { opacity: 0; } }
    @media(prefers-reduced-motion: reduce) { .overview-position, .overview-wire { transition: none; } }
    .relation-entry { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; width: 100%; border: 0; border-radius: 6px; background: transparent; }
    .relation-entry:hover { color: var(--accent); background: var(--highlight); }
    .scope { display: block; margin-bottom: 5px; color: var(--accent); font-size: .84rem; overflow-wrap: anywhere; }
    .nav > details > summary { display: none; cursor: pointer; font-weight: 630; }
    .nav label { display: block; font-size: .82rem; font-weight: 620; margin-bottom: 5px; }
    .nav input { width: 100%; }
    #flows { margin-top: 13px; }
    #flows details { margin-bottom: 5px; }
    #flows summary { cursor: pointer; padding: 5px 2px; font-weight: 610; }
    .nav-button, .relation { display: block; width: 100%; border: 0; background: transparent; padding: 6px 9px; border-radius: 6px; text-align: left; overflow-wrap: anywhere; }
    .nav-button { font-size: .86rem; }
    .nav-button:hover, .nav-button[aria-current], .relation:hover { background: var(--highlight); color: var(--accent); }
    #summary { margin: 7px 0 16px; }
    .guide-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .guide-control { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); padding: 6px 10px; font-size: .86rem; }
    .guide-control:hover:not(:disabled), .guide-control[aria-pressed="true"] { border-color: var(--accent); background: var(--highlight); color: var(--accent); }
    .guide-control:disabled { cursor: default; opacity: .6; }
    .guide-status { margin-left: auto; font-size: .84rem; }
    .guide-choices { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .guide-choices .guide-control { color: var(--accent); text-align: left; overflow-wrap: anywhere; }
    .process-viewport { overflow: clip; }
    .graph { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; padding: 16px 24px; transform: scale(var(--process-scale, 1)); transform-origin: top left; }
    .graph svg { position: absolute; inset: 0; height: 100%; width: 100%; pointer-events: none; color: var(--wire); }
    .graph path.wire { stroke: currentColor; fill: none; stroke-width: 1.35px; }
    .graph path.return-edge { stroke-dasharray: 5 4; }
    .graph path.selected { color: var(--accent); stroke-width: 2px; }
    .graph path.walked { color: var(--accent); stroke-width: 2.5px; }
    .graph path.outside { opacity: .28; }
    #lanes { position: relative; display: grid; gap: 28px; }
    .lane { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .step { flex: 1 1 125px; max-width: 430px; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; text-align: left; padding: 8px 11px; overflow-wrap: anywhere; }
    .step:hover, .step[aria-pressed="true"] { border-color: var(--accent); background: var(--highlight); }
    .step.on-route { border-color: var(--accent); }
    .step.next-step { border: 1px dashed var(--accent); }
    .step:disabled { opacity: .56; cursor: default; }
    .step:disabled:hover { background: var(--panel); border-color: var(--line); }
    .step.on-route:disabled { opacity: .88; border-color: var(--accent); }
    .step strong { font-weight: 640; }
    .step span { display: block; font-size: .84rem; margin-top: 3px; color: var(--quiet); }
    .step .condition { margin: 0 0 3px; color: var(--accent); font-size: .76rem; }
    .step .step-role { display: flex; align-items: center; gap: 7px; margin: 0 0 4px; font-size: .75rem; font-weight: 630; color: var(--accent); }
    .step-role::before { content: ""; width: 8px; height: 8px; border: 1px solid currentColor; border-radius: 50%; }
    .step-role.entry::before { background: currentColor; }
    .step-role.branch::before { border-radius: 1px; rotate: 45deg; }
    .step .step-state, .detail .step-state { display: inline-block; margin: 4px 0; padding: 1px 7px; border: 1px solid var(--line); border-radius: 6px; font-size: .75rem; font-weight: 630; color: var(--quiet); }
    .step .step-state.implemented, .detail .step-state.implemented { color: var(--accent); border-color: currentColor; }
    .step .step-state.verified, .detail .step-state.verified { color: var(--root-ink); background: var(--root-fill); }
    .detail { border-top: 2px solid var(--accent); padding-top: 10px; overflow-wrap: anywhere; }
    .detail h2 { font-size: 1.12rem; margin-bottom: 5px; }
    .detail h3 { font-size: .88rem; margin: 13px 0 3px; }
    .detail ul { padding-left: 19px; margin: 5px 0 0; font-size: .88rem; }
    .detail li + li { margin-top: 5px; }
    .detail code { font-size: .79rem; color: var(--quiet); user-select: all; }
    .detail time { display: block; color: var(--quiet); font-size: .79rem; }
    .detail .divergence { white-space: pre-wrap; }
    .evidence-row { display: flex; align-items: baseline; gap: 8px; }
    .source-badge { flex: none; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; background: var(--highlight); color: var(--accent); font-size: .73rem; font-weight: 630; }
    .source-badge:hover { border-color: var(--accent); }
    .reader-dialog { width: min(42rem, calc(100% - 28px)); max-height: calc(100dvh - 28px); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); }
    .reader-dialog::backdrop { background: #0008; }
    .dialog-surface { padding: 16px clamp(13px,3vw,24px) 20px; overflow-wrap: anywhere; }
    .dialog-heading { display: flex; justify-content: space-between; align-items: start; gap: 10px; margin-bottom: 12px; }
    .dialog-heading h2 { font-size: 1.2rem; }
    .dialog-content h3 { font-size: 1rem; margin-top: 14px; }
    .dialog-content ul { padding-inline-start: 1.4em; margin: 5px 0 0; }
    .dialog-content kbd { color: var(--accent); }
    .source-fields { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 4px 12px; margin: 0 0 10px; }
    .source-fields dt { color: var(--quiet); }
    .source-fields dd { margin: 0; }
    .evidence-preview { max-height: 40dvh; overflow: auto; padding: 8px; margin: 5px 0; border: 1px solid var(--line); white-space: pre-wrap; font-size: .82rem; tab-size: 4; }
    .relation { padding: 4px 0; color: var(--accent); font-size: .89rem; }
    .relations { grid-column: 2 / -1; }
    .relations-heading { margin-bottom: 15px; }
    .relations-map { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0,1fr) minmax(140px,.75fr) minmax(0,1fr); gap: clamp(22px,3.3vw,48px); align-items: center; }
    .relations-map h3 { font-size: .86rem; margin-bottom: 6px; }
    .map-wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .relations-side, .relations-current { position: relative; z-index: 1; min-width: 0; overflow-wrap: anywhere; }
    .relations-current { position: relative; padding: 15px; border: 1px solid var(--accent); border-radius: 10px; background: var(--highlight); }
    .relations-current .relation { width: auto; }
    .relations-current strong { display: block; line-height: 1.4; margin-bottom: 5px; }
    .relations-list { margin: 0; padding: 0; list-style: none; }
    .relations-list li + li { margin-top: 6px; }
    .relation-entry { align-items: flex-start; flex-direction: column; gap: 2px; padding: 9px 11px; border: 1px solid var(--line); background: var(--panel); }
    .relation-entry small { color: var(--quiet); font-size: .78rem; }
    .relation-entry .relation-type { font-weight: 640; color: var(--accent); }
    .relation-entry .relation-type.uses { color: var(--dependency); }
    .relations-legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: .82rem; color: var(--quiet); }
    .relations-legend span::before { content: ""; display: inline-block; border-top: 2px solid var(--accent); width: 19px; margin-right: 6px; vertical-align: middle; }
    .relations-legend .uses::before { border-top-style: dashed; border-color: var(--dependency); }
    .empty-relations { border: 1px solid var(--line); background: var(--panel); padding: 16px; border-radius: 10px; }
    .empty-relations .relation { width: auto; margin-top: 3px; }
    .refs { list-style: none; padding-left: 0 !important; }
    .beginner { display: flex; align-items: center; gap: 7px; cursor: pointer; }
    .beginner input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .term { display: inline; border: 0; padding: 0; color: var(--accent); background: transparent; text-decoration: underline dotted; text-underline-offset: .2em; text-align: left; }
    .term:hover, .term[aria-describedby] { background: var(--highlight); }
    .term-tooltip { position: fixed; z-index: 2; width: min(310px, calc(100vw - 24px)); border: 1px solid var(--line); padding: 11px 13px; border-radius: 9px; background: var(--panel); color: var(--ink); box-shadow: 0 5px 22px #0002; font-size: .9rem; overflow-wrap: anywhere; }
    .term-tooltip strong { display: block; color: var(--accent); margin-bottom: 3px; }
    @media(max-width: 1020px) { .workspace { grid-template-columns: minmax(160px,205px) minmax(0,1fr); } .detail { grid-column: 2; } }
    @media(max-width: 800px) {
      .relations-map { grid-template-columns: 1fr; gap: 14px; }
      .relations-current { grid-row: 1; }
      .relations-map canvas, .relations-legend { display: none; }
      .relation-entry[data-direction="in"] .relation-type::before { content: "↑ "; }
      .relation-entry[data-direction="out"] .relation-type::before { content: "↓ "; }
    }
    @media(max-width: 650px) {
      .workspace { grid-template-columns: 1fr; gap: 19px; padding-top: 16px; }
      .detail, .relations { grid-column: 1; }
      .nav > details > summary { display: list-item; }
      .nav label { margin-top: 8px; }
      .graph { padding-inline: 18px; }
      .guide-status { width: 100%; margin-left: 0; }
    }
    @media print {
      body > header, nav, .overview-search, .overview-viewport, .guide-bar, .guide-choices,
      .reader-dialog, .term-tooltip, .review-dialog, .review-menu, .source-badge { display: none !important; }
      .workspace { display: block; max-width: none; padding: 0; }
      .detail { margin-top: 18px; }
      .process-viewport { height: auto !important; overflow: visible; }
      .graph { --process-scale: 1 !important; }
      .print-topology { display: block; break-inside: avoid; }
      .print-topology svg { display: block; width: 100%; height: auto; max-height: 225mm; }
      .graph, .print-topology, .relations-map { print-color-adjust: exact; }
      .step, .refs li { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header>
    <div><p class="brand">Threadlight</p><h1 id="project"></h1></div>
    <div class="header-actions">
      <label class="beginner"><input type="checkbox" id="beginner">新手模式</label>
      <button class="guide-control header-control" id="shortcut-help" type="button" aria-haspopup="dialog" aria-controls="reader-dialog">快捷键</button>
      <details class="export-options" id="export-options">
        <summary id="export-toggle" class="header-control">导出</summary>
        <div class="export-panel">
          <button class="guide-control" id="export-png" type="button">导出 PNG</button>
          <button class="guide-control" id="print-view" type="button">打印 / 另存为 PDF</button>
        </div>
      </details>
      <span id="revision" class="muted"></span><!-- threadlight-heading -->
    </div>
  </header>
  <nav class="views" aria-label="架构视角">
    <button class="view-button" type="button" data-view="overview">功能总览</button>
    <button class="view-button" type="button" data-view="process">操作流程</button>
    <button class="view-button" type="button" data-view="relations">功能关系</button>
  </nav>
  <main class="workspace" id="workspace">
    <section id="overview-panel" aria-labelledby="overview-title" hidden>
      <div class="overview-heading"><h2 id="overview-title">项目功能</h2><p id="overview-count" class="muted"></p></div>
      <div class="overview-search"><label for="overview-search">筛选项目功能</label><input type="search" id="overview-search"></div>
      <div class="overview-viewport" id="overview-viewport">
        <div class="overview-map" id="overview-tree" role="tree" aria-labelledby="overview-title">
          <svg id="overview-wires" aria-hidden="true"></svg>
        </div>
      </div>
      <div class="print-topology" id="print-topology"></div>
      <p class="muted" id="overview-empty" role="status" hidden>找不到匹配的分支或步骤</p>
    </section>
    <nav class="nav" id="navigation" aria-label="功能线路" hidden>
      <details id="navigator" open><summary>切换线路</summary><label for="search">查找功能线路</label><input type="search" id="search"><div id="flows"></div></details>
    </nav>
    <section class="diagram" id="process-panel" aria-labelledby="title" hidden>
      <span class="scope" id="process-group"></span><h2 id="title" data-review-text=""></h2><p id="summary" class="muted" data-review-text=""></p>
      <div class="guide-bar">
        <button class="guide-control" id="fit-process" type="button" aria-controls="graph">适应窗口</button>
        <button class="guide-control" id="guide-toggle" type="button" aria-pressed="false">从这一步开始导览</button>
        <button class="guide-control" id="guide-back" type="button" hidden>回到上一步</button>
        <p class="guide-status muted" id="guide-status" aria-live="polite" tabindex="-1"></p>
      </div>
      <div class="guide-choices" id="guide-choices" hidden></div>
      <div class="process-viewport" id="process-viewport">
        <div class="graph" id="graph">
          <svg aria-hidden="true"><defs><marker id="arrow" markerWidth="7" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8z" fill="var(--wire)"/></marker></defs><g id="wires"></g></svg>
          <div id="lanes"></div>
        </div>
      </div>
    </section>
    <aside class="detail" id="detail" aria-label="步骤详情" aria-live="polite" hidden></aside>
    <section class="relations" id="relations-panel" aria-labelledby="relations-title" hidden>
      <div class="relations-heading"><span class="scope" id="relations-group"></span><h2 id="relations-title"></h2></div>
      <div id="relations-content"></div>
    </section>
  </main>
  <dialog class="reader-dialog" id="reader-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog-surface">
      <div class="dialog-heading">
        <h2 id="dialog-title"></h2>
        <button class="guide-control" id="dialog-close" type="button" autofocus>关闭</button>
      </div>
      <div class="dialog-content" id="dialog-content"></div>
    </div>
  </dialog>
  <div id="term-tooltip" class="term-tooltip" role="tooltip" hidden><strong></strong><p></p></div>
  <script type="application/json" id="data">"THREADLIGHT_GRAPH_DATA"</script>
  <!-- threadlight-review -->
  <script>
    const data = JSON.parse(document.getElementById('data').textContent)
    const by = id => document.getElementById(id)
    const graph = by('graph'), processViewport = by('process-viewport')
    const lanes = by('lanes'), wires = by('wires'), detail = by('detail')
    const groups = data.groups.map(group => ({
      group, items: group.flows.map(flow => ({ group, flow, key: group.id + '/' + flow.id })),
    }))
    const areas = data.project.areas ?? []
    const overviewMap = by('overview-tree'), overviewViewport = by('overview-viewport')
    const overviewWires = by('overview-wires'), overviewSearch = by('overview-search')
    const overviewLabels = { project: '项目', area: '领域', group: '功能区', flow: '线路', step: '步骤' }
    const overviewSize = { width: 208, height: 56, stepHeight: 44, columnGap: 72, rowGap: 12, padding: 20 }
    const overviewExpanded = new Set(['project'])
    const overviewSearchCollapsed = new Set()
    const overviewCards = new Map()
    const overviewFocusWires = []
    let overviewRoot, overviewTerm
    const items = groups.flatMap(group => group.items)
    const itemByKey = new Map(items.map(item => [item.key, item]))
    const connections = new Map(items.map(item => [item.key, { incoming: [], outgoing: [] }]))
    let linkCount = 0
    for (const item of items) {
      for (const link of item.flow.links ?? []) {
        const target = itemByKey.get(link.group + '/' + link.flow)
        connections.get(item.key).outgoing.push({ item: target, kind: link.kind })
        connections.get(target.key).incoming.push({ item, kind: link.kind })
        linkCount++
      }
    }
    const kinds = { source: '实现', test: '测试', documentation: '文档', workflow: '构建' }
    const cards = new Map()
    const selectedByFlow = new Map()
    const viewButtons = document.querySelectorAll('.view-button')
    const narrow = matchMedia('(max-width: 650px)')
    const beginner = by('beginner'), tooltip = by('term-tooltip')
    const readerDialog = by('reader-dialog'), dialogClose = by('dialog-close'), shortcutHelp = by('shortcut-help')
    const exportOptions = by('export-options'), exportPng = by('export-png'), fitProcess = by('fit-process')
    const glossary = new Map(data.glossary.map(entry => [entry.term.toLowerCase(), entry.definition]))
    const patterns = [...glossary.keys()].sort((a, b) => b.length - a.length).map(term => {
      const escape = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      const start = /^[a-z0-9_]/.test(term) ? '(?<![a-z0-9_])' : ''
      const end = /[a-z0-9_]$/.test(term) ? '(?![a-z0-9_])' : ''
      return start + escape + end
    })
    const termPattern = new RegExp(patterns.join('|'), 'gi')
    let current = items[0], selected, mode, guide
    let activeTerm, pinned, closeTimer, dialogTrigger, processFitted
    by('project').textContent = data.project.name
    document.title = data.project.name + ' · Threadlight'
    const revision = data.snapshot?.id || data.snapshot?.baseCommit
    if (typeof revision === 'string') by('revision').textContent = '源码快照 ' + revision.slice(0, 8)

    function make(tag, text, css) {
      const element = document.createElement(tag)
      if (text) element.textContent = text
      if (css) element.className = css
      return element
    }

    function button(text, css, fn) {
      const result = make('button', text, css)
      result.type = 'button'
      result.addEventListener('click', fn)
      return result
    }

    function openReaderDialog(title, trigger, ...content) {
      if (readerDialog.open) return
      hideTooltip()
      dialogTrigger = trigger === document.body ? shortcutHelp : trigger
      by('dialog-title').textContent = title
      by('dialog-content').replaceChildren(...content)
      readerDialog.showModal()
      dialogClose.focus()
    }

    function showShortcuts(trigger) {
      const shortcuts = make('ul')
      for (const [keys, description] of [
        [['/', 'Ctrl+K', '⌘+K'], '聚焦功能总览或操作流程的搜索框'],
        [['?'], '打开快捷键与说明'],
        [['f'], '将拓扑滚动到左上角，或将流程图适应窗口'],
        [['Esc'], '关闭浮层'],
        [['↑', '↓', '←', '→', 'Home', 'End'], '浏览总览节点，展开或收起分支'],
      ]) {
        const row = make('li')
        keys.forEach((key, index) => {
          if (index) row.append(' / ')
          row.append(make('kbd', key))
        })
        row.append(' · ' + description)
        shortcuts.append(row)
      }
      const views = make('ul')
      views.append(make('li', '功能总览 · 逐级展开项目功能，找到线路和步骤。'),
        make('li', '操作流程 · 查看所选线路的步骤、分支和源码证据。'),
        make('li', '功能关系 · 查看当前线路与其他线路的接续和使用关系。'))
      openReaderDialog('快捷键与说明', trigger, shortcuts, make('h3', '三个视图'), views)
    }

    function handleShortcuts(event) {
      const { target, key, ctrlKey, metaKey, altKey, shiftKey } = event
      if (event.defaultPrevented || event.isComposing || readerDialog.open || target.closest?.('dialog[open]') ||
        target.isContentEditable || target.closest?.('input, textarea, select') || altKey) return
      if ((ctrlKey || metaKey) && (key.toLowerCase() !== 'k' || shiftKey)) return
      if (key === '/' || ctrlKey || metaKey) {
        if (mode !== 'overview' && mode !== 'process') return
        event.preventDefault()
        if (mode === 'overview') overviewSearch.focus()
        else {
          by('navigator').open = true
          by('search').focus()
        }
      } else if (key === '?') {
        event.preventDefault()
        showShortcuts(document.activeElement)
      } else if (key === 'f') {
        if (mode === 'overview') overviewViewport.scrollLeft = overviewViewport.scrollTop = 0
        else if (mode === 'process') fitProcessToWindow()
        else return
        event.preventDefault()
      }
    }

    function stateOfStep(node) {
      return node.state ?? (node.sources.length ? 'implemented' : 'planned')
    }

    function stepBadge(node) {
      const state = stateOfStep(node)
      return make('span', data.stepStateLabels[state], 'step-state ' + state)
    }

    function renderVerification(node) {
      if (node.verification?.length) {
        const list = make('ul')
        for (const { result, summary, command, at } of node.verification) {
          const row = make('li')
          row.append(make('strong', data.verificationLabels[result]), ' · ' + summary)
          if (command) row.append(document.createElement('br'), make('code', command))
          const time = make('time', at)
          time.dateTime = at
          row.append(time)
          list.append(row)
        }
        detail.append(make('h3', '验证记录'), list)
      }
      if (node.divergence) detail.append(make('h3', '与预期的差异'), make('p', node.divergence, 'divergence'))
    }

    let tooltipCleanup
    function positionTooltip() {
      if (!activeTerm) return
      const anchor = activeTerm.getBoundingClientRect()
      if (anchor.bottom < 0 || anchor.top > innerHeight) {
        hideTooltip()
        return
      }
      // The review page ships a bundled positioning library; the offline file
      // has no external assets, so keep the local math as the fallback.
      if (window.ThreadlightFloating?.position) return
      const { width, height } = tooltip.getBoundingClientRect()
      const below = anchor.bottom + 6
      const above = anchor.top - height - 6
      tooltip.style.top = Math.max(8, below + height > innerHeight - 8 && above >= 8
        ? above : Math.min(below, innerHeight - height - 8)) + 'px'
      tooltip.style.left = Math.max(12, Math.min(anchor.left, innerWidth - width - 12)) + 'px'
    }

    function hideTooltip() {
      clearTimeout(closeTimer)
      activeTerm?.removeAttribute('aria-describedby')
      activeTerm = null
      pinned = false
      tooltipCleanup?.()
      tooltipCleanup = undefined
      tooltip.hidden = true
    }

    function showTooltip(trigger, definition) {
      clearTimeout(closeTimer)
      if (activeTerm !== trigger) {
        hideTooltip()
        activeTerm = trigger
        tooltip.firstElementChild.textContent = trigger.textContent
        tooltip.lastElementChild.textContent = definition
        trigger.setAttribute('aria-describedby', tooltip.id)
        tooltip.hidden = false
      }
      if (window.ThreadlightFloating?.position && !tooltipCleanup) {
        tooltipCleanup = window.ThreadlightFloating.position(trigger, tooltip, { placement: 'top-start' })
      }
      positionTooltip()
    }

    function scheduleTooltipClose() {
      clearTimeout(closeTimer)
      if (!pinned && activeTerm !== document.activeElement) closeTimer = setTimeout(hideTooltip, 160)
    }

    function withTerms(element, text) {
      element.textContent = text
      if (!beginner.checked) return element
      const parts = []
      let end = 0
      for (const match of text.matchAll(termPattern)) {
        const term = match[0], definition = glossary.get(term.toLowerCase())
        if (!definition) continue
        parts.push(text.slice(end, match.index))
        const trigger = button(term, 'term', () => {
          if (activeTerm === trigger && pinned) hideTooltip()
          else {
            showTooltip(trigger, definition)
            pinned = true
          }
        })
        trigger.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') showTooltip(trigger, definition) })
        trigger.addEventListener('pointerleave', scheduleTooltipClose)
        trigger.addEventListener('focus', () => showTooltip(trigger, definition))
        trigger.addEventListener('blur', () => { if (activeTerm === trigger) hideTooltip() })
        parts.push(trigger)
        end = match.index + term.length
      }
      if (parts.length) element.replaceChildren(...parts, text.slice(end))
      return element
    }

    function reviewText(tag, text, node) {
      const element = make(tag)
      if (data.review) element.dataset.reviewText = node
      return withTerms(element, text)
    }

    function overviewEntries() {
      const modules = groups.map(({ group, items }) => ({
        kind: 'group', key: 'group/' + group.id, title: group.title, summary: group.summary, group,
        children: items.map(item => ({
          kind: 'flow', key: 'flow/' + item.key, title: item.flow.title, summary: item.flow.summary, item,
          children: item.flow.nodes.map(node => ({
            kind: 'step', key: 'step/' + item.key + '/' + node.id, title: node.title, summary: node.summary,
            item, node, children: [],
          })),
        })),
      }))
      const children = areas.length ? areas.map(area => ({
        kind: 'area', key: 'area/' + area.id, title: area.title, summary: area.summary,
        children: modules.filter(entry => entry.group.area === area.id),
      })) : modules
      return { kind: 'project', key: 'project', title: data.project.name, children }
    }

    function filterOverview(entry, term) {
      const children = entry.children.map(child => filterOverview(child, term)).filter(Boolean)
      const matched = (entry.title + ' ' + (entry.summary ?? '')).toLowerCase().includes(term)
      return matched || children.length ? { ...entry, children, matched } : null
    }

    function layoutOverview(root) {
      const { width, height, stepHeight, columnGap, rowGap, padding } = overviewSize
      const nodes = new Map()
      let right = 0, bottom = 0, nextRow = padding + height / 2
      function place(entry, depth, parent) {
        const x = padding + depth * (width + columnGap)
        const h = entry.kind === 'step' ? stepHeight : height
        const open = entry.children.length > 0 &&
          (overviewTerm ? !overviewSearchCollapsed.has(entry.key) : overviewExpanded.has(entry.key))
        const node = { entry, depth, parent, x, height: h, open }
        nodes.set(entry.key, node)
        if (open) {
          const children = entry.children.map(child => place(child, depth + 1, node))
          node.center = (children[0].center + children.at(-1).center) / 2
        } else {
          node.center = nextRow
          nextRow += height + rowGap
        }
        right = Math.max(right, x + width)
        bottom = Math.max(bottom, node.center + h / 2)
        return node
      }
      const project = place(root, 0)
      return { nodes, project, width: right + padding, height: bottom + padding }
    }

    function toggleOverview(key, wasOpen) {
      const changes = overviewTerm ? overviewSearchCollapsed : overviewExpanded
      if (overviewTerm ? wasOpen : !wasOpen) changes.add(key)
      else changes.delete(key)
      renderOverview()
    }

    function createOverviewCard(entry, parent) {
      const position = make('div', '', 'overview-position')
      position.setAttribute('role', 'treeitem')
      position.dataset.overviewKey = entry.key
      position.dataset.kind = entry.kind
      const isFlow = entry.kind === 'flow'
      const kind = overviewLabels[entry.kind]
      const label = make('span', '', 'overview-label')
      const title = make('strong', entry.title)
      const card = button('', 'overview-card', event => {
        if (isFlow) activate('process', entry.item, true)
        else if (entry.node) {
          const selection = window.getSelection()
          if (event.detail > 0 && selection && !selection.isCollapsed && title.contains(selection.anchorNode)) return
          activate('process', entry.item, true, true, entry.node.id)
        } else {
          const open = card.getAttribute('aria-expanded')
          if (open !== null) toggleOverview(entry.key, open === 'true')
        }
      })
      card.dataset.kind = entry.kind
      card.setAttribute('aria-label', entry.title + '，' + (isFlow ? '打开操作流程' : kind))
      card.title = entry.title + (entry.summary ? '\n' + entry.summary : '')
      if (entry.group) card.dataset.reviewGroup = entry.group.id
      if (entry.item) card.dataset.overviewFlow = entry.item.key
      if (entry.node) {
        const state = stateOfStep(entry.node)
        const dot = make('span', '', 'overview-state ' + state)
        dot.title = data.stepStateLabels[state]
        dot.setAttribute('aria-hidden', 'true')
        card.title = entry.title + ' · ' + dot.title
        card.append(dot)
        if (data.review) card.dataset.reviewStep = title.dataset.reviewText = entry.node.id
      } else {
        label.append(make('span', kind, 'overview-kind'))
        if (data.review && isFlow) title.dataset.reviewText = ''
      }
      label.append(title)
      card.append(label)
      position.append(card)

      let control = card, count
      if (isFlow) {
        control = button('', 'overview-expander overview-flow-toggle', () =>
          toggleOverview(entry.key, control.getAttribute('aria-expanded') === 'true'))
        control.setAttribute('aria-label', entry.title + ' 的步骤')
        control.title = '展开或收起步骤'
        count = make('span')
        control.append(count)
        position.append(control)
      } else if (!entry.node) {
        count = make('span', '', 'overview-expander')
        count.setAttribute('aria-hidden', 'true')
        card.append(count)
      }

      let wire
      if (parent) {
        wire = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        wire.setAttribute('class', 'overview-wire')
        overviewWires.append(wire)
      }
      return { position, card, control, count, wire }
    }

    function updateOverviewCard(record, node) {
      const { entry, x, height, center, depth, parent, open } = node
      const { position, card, control, count, wire } = record
      const { width, columnGap } = overviewSize
      record.node = node
      position.style.left = x + 'px'
      position.style.top = center - height / 2 + 'px'
      position.style.width = width + 'px'
      position.style.height = height + 'px'
      position.setAttribute('aria-level', depth + 1)
      card.toggleAttribute('data-match', Boolean(entry.matched))
      const branch = entry.children.length > 0
      for (const element of [position, control]) {
        if (branch) element.setAttribute('aria-expanded', open)
        else element.removeAttribute('aria-expanded')
      }
      if (count) {
        count.textContent = String(entry.children.length)
        if (control === card) count.hidden = !branch
        else control.hidden = !branch
      }
      if (wire) {
        const start = parent.x + width, bend = start + columnGap / 2
        const curve = `M${start} ${parent.center} C${bend} ${parent.center} ${bend} ${center} ${x} ${center}`
        wire.setAttribute('d', curve)
        wire.style.d = 'path("' + curve + '")'
        wire.classList.toggle('expanded', open)
      }
    }

    function focusOverviewWires(target) {
      for (const wire of overviewFocusWires) wire.classList.remove('focused')
      overviewFocusWires.length = 0
      let key = target?.closest('[data-overview-key]')?.dataset.overviewKey
      while (key) {
        const record = overviewCards.get(key)
        if (!record?.wire) break
        record.wire.classList.add('focused')
        overviewFocusWires.push(record.wire)
        key = record.node.parent.entry.key
      }
    }

    function renderOverview(resetScroll = false) {
      overviewRoot ??= overviewEntries()
      overviewTerm = overviewSearch.value.trim().toLowerCase()
      if (resetScroll) overviewSearchCollapsed.clear()
      const root = overviewTerm ? filterOverview(overviewRoot, overviewTerm) : overviewRoot
      by('overview-count').textContent = (areas.length ? areas.length + ' 个领域 · ' : '') +
        groups.length + ' 个功能区 · ' + items.length + ' 条线路'
      by('overview-empty').hidden = Boolean(root)
      overviewViewport.hidden = !root
      exportPng.disabled = !root
      const layout = root && layoutOverview(root)
      for (const [key, record] of overviewCards) {
        if (layout?.nodes.has(key)) continue
        record.position.remove()
        record.wire?.remove()
        overviewCards.delete(key)
      }
      if (!layout) {
        focusOverviewWires(null)
        return
      }
      overviewMap.style.width = layout.width + 'px'
      overviewMap.style.height = layout.height + 'px'
      // Keep the existing cards in place in the DOM so focus and position transitions survive.
      let next = overviewWires.nextElementSibling
      for (const [key, node] of layout.nodes) {
        let record = overviewCards.get(key)
        if (!record) {
          record = createOverviewCard(node.entry, node.parent)
          overviewCards.set(key, record)
          overviewMap.insertBefore(record.position, next)
        } else {
          next = next.nextElementSibling
        }
        updateOverviewCard(record, node)
      }
      focusOverviewWires(document.activeElement)
      if (resetScroll) {
        overviewViewport.scrollLeft = 0
        overviewViewport.scrollTop = Math.max(0, layout.project.center - overviewViewport.clientHeight / 2)
      }
    }

    function navigateOverview(event) {
      const key = event.target.closest('[data-overview-key]')?.dataset.overviewKey
      const node = overviewCards.get(key)?.node
      if (!node) return
      const { entry, parent, open } = node
      if (event.key === 'ArrowRight') {
        if (open) overviewCards.get(entry.children[0].key)?.card.focus()
        else if (entry.children.length) toggleOverview(key, false)
      } else if (event.key === 'ArrowLeft') {
        if (open) toggleOverview(key, true)
        else if (parent) overviewCards.get(parent.entry.key)?.card.focus()
      } else if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
        const cards = [...overviewMap.querySelectorAll('.overview-card')]
        const index = cards.indexOf(overviewCards.get(key).card)
        const next = { ArrowDown: index + 1, ArrowUp: index - 1, Home: 0, End: cards.length - 1 }[event.key]
        cards[next]?.focus()
      } else return
      event.preventDefault()
    }

    function svgEscape(value) {
      return String(value).toWellFormed().replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\ufffe\uffff]/g, '')
        .replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' })[char])
    }

    function svgText(element, x, y, value = element.textContent, align = 'start') {
      const { color, fontFamily, fontSize, fontWeight } = getComputedStyle(element)
      return `<text x="${x}" y="${y}" dominant-baseline="central" text-anchor="${align}" fill="${color}"
        font-family="${svgEscape(fontFamily)}" font-size="${fontSize}" font-weight="${fontWeight}">${svgEscape(value)}</text>`
    }

    function serializeTopology() {
      if (!overviewCards.size) return
      const width = parseFloat(overviewMap.style.width), height = parseFloat(overviewMap.style.height)
      const panel = getComputedStyle(overviewViewport).backgroundColor
      const cardWidth = overviewSize.width
      const lines = [], nodes = []
      for (const { node, card, wire, control, count } of overviewCards.values()) {
        if (wire) {
          // Read the resolved theme color independently of any running stroke transition.
          const { color, strokeWidth } = getComputedStyle(wire)
          lines.push(`<path d="${wire.getAttribute('d')}" fill="none" stroke="${color}" stroke-width="${strokeWidth}"/>`)
        }
        const { entry, x, center, height: cardHeight, open } = node
        const y = center - cardHeight / 2
        const { backgroundColor, borderTopColor } = getComputedStyle(card)
        const dot = card.querySelector('.overview-state'), kind = card.querySelector('.overview-kind')
        const left = dot ? 28 : 12
        const labelWidth = cardWidth - left - (count && !count.hidden ? (control === card ? 48 : 62) : 12)
        const middle = cardHeight / 2
        const label = card.querySelector('strong')
        const text = (kind ? svgText(kind, 0, middle - 9) : '') + svgText(label, 0, middle + (kind ? 8 : 0))
        const stateDot = dot ? `<circle cx="16" cy="${middle}" r="4" fill="${getComputedStyle(dot).backgroundColor}"/>` : ''
        const toggle = count && !count.hidden ? svgText(control === card ? count : control,
          cardWidth - (control === card ? 27 : 30), middle, count.textContent + (open ? ' ▾' : ' ▸'), 'middle') : ''
        nodes.push(`<g transform="translate(${x} ${y})"><title>${svgEscape(entry.title)}</title>
          <rect x=".5" y=".5" width="${cardWidth - 1}" height="${cardHeight - 1}" rx="9" fill="${backgroundColor}" stroke="${borderTopColor}"/>
          ${stateDot}<svg x="${left}" width="${labelWidth}" height="${cardHeight}" overflow="hidden">${text}</svg>${toggle}</g>`)
      }
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
        <rect width="100%" height="100%" fill="${panel}"/>${lines.join('')}${nodes.join('')}</svg>`
      return { svg, width, height }
    }

    function svgDataUrl(svg) {
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg)
    }

    function downloadTopology(file, extension) {
      const url = typeof file === 'string' ? file : URL.createObjectURL(file)
      const link = make('a')
      link.href = url
      link.download = data.project.name.replace(/[<>:"/\\|?*\x00-\x1f]/g, '_').trim() + '-topology.' + extension
      document.body.append(link)
      link.click()
      link.remove()
      if (typeof file !== 'string') setTimeout(() => URL.revokeObjectURL(url), 1000)
    }

    async function exportTopology() {
      const topology = mode === 'overview' && serializeTopology()
      if (!topology) return
      const { svg, width, height } = topology
      const canvas = make('canvas')
      const canDownloadBlob = typeof Blob === 'function' && typeof URL.createObjectURL === 'function'
      let png
      if (canDownloadBlob && typeof Image === 'function' && typeof canvas.toBlob === 'function') {
        try {
          const scale = Math.min(window.devicePixelRatio || 1, 2, 4096 / Math.max(width, height))
          canvas.width = Math.ceil(width * scale)
          canvas.height = Math.ceil(height * scale)
          const pen = canvas.getContext('2d')
          if (pen) {
            const image = new Image()
            image.src = svgDataUrl(svg)
            await image.decode()
            pen.drawImage(image, 0, 0, canvas.width, canvas.height)
            png = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'))
          }
        } catch { /* Export SVG if the browser cannot rasterize this topology. */ }
      }
      if (png) downloadTopology(png, 'png')
      else downloadTopology(canDownloadBlob ? new Blob([svg], { type: 'image/svg+xml' }) : svgDataUrl(svg), 'svg')
    }

    function canvasLayer(canvas) {
      const box = canvas.getBoundingClientRect()
      if (!box.width || !box.height) return
      const scale = Math.min(devicePixelRatio, 2, 4096 / Math.max(box.width, box.height))
      canvas.width = Math.ceil(box.width * scale)
      canvas.height = Math.ceil(box.height * scale)
      const pen = canvas.getContext('2d')
      if (!pen) return
      pen.scale(scale, scale)
      pen.lineJoin = 'round'
      return { box, pen }
    }

    function navigation() {
      const term = by('search').value.trim().toLowerCase()
      by('flows').replaceChildren()
      for (const { group, items } of groups) {
        const matches = items.filter(item => (
          group.title + ' ' + item.flow.title + ' ' + item.flow.summary
        ).toLowerCase().includes(term))
        if (!matches.length) continue
        const section = make('details')
        section.open = Boolean(term) || current.group === group
        const heading = make('summary', group.title)
        heading.dataset.reviewGroup = group.id
        section.append(heading)
        for (const item of matches) {
          const action = button(item.flow.title, 'nav-button', () => activate(mode, item, true))
          if (item.key === current.key) action.setAttribute('aria-current', 'page')
          section.append(action)
        }
        by('flows').append(section)
      }
      if (!by('flows').children.length) by('flows').append(make('p', '找不到匹配的线路', 'muted'))
    }

    function renderRelations() {
      const { group, flow, key } = current
      by('relations-group').textContent = group.title
      by('relations-title').textContent = flow.title
      const content = by('relations-content')
      const { incoming, outgoing } = connections.get(key)
      const processLink = button('查看操作流程 →', 'relation', () => activate('process', current, true))
      if (!incoming.length && !outgoing.length) {
        const blank = make('div', '', 'empty-relations')
        blank.append(make('p', linkCount ? '这条线路暂无已记录的跨线路关系。' : '这份图谱暂无已记录的跨线路关系。', 'muted'), processLink)
        content.replaceChildren(blank)
        return
      }
      function side(title, entries, incoming) {
        const column = make('section', '', 'relations-side')
        column.append(make('h3', title))
        if (!entries.length) {
          column.append(make('p', '暂无记录', 'muted'))
          return column
        }
        const list = make('ul', '', 'relations-list')
        for (const { item, kind } of entries) {
          const type = kind === 'continues' ? (incoming ? '前序线路' : '后续线路') : (incoming ? '使用方' : '所用线路')
          const link = button('', 'relation-entry', () => activate('relations', item, true))
          link.dataset.direction = incoming ? 'in' : 'out'
          link.dataset.kind = kind
          link.append(make('small', type, 'relation-type ' + kind), make('span', item.flow.title), make('small', item.group.title))
          const row = make('li')
          row.append(link)
          list.append(row)
        }
        column.append(list)
        return column
      }
      const map = make('div', '', 'relations-map')
      const canvas = make('canvas', '', 'map-wires')
      canvas.setAttribute('aria-hidden', 'true')
      const center = make('section', '', 'relations-current')
      center.append(make('h3', '当前线路'), make('strong', flow.title), processLink)
      map.append(canvas, side('指向当前线路', incoming, true), center, side('当前线路指向', outgoing, false))
      const legend = make('div', '', 'relations-legend')
      const kinds = new Set([...incoming, ...outgoing].map(entry => entry.kind))
      if (kinds.has('continues')) legend.append(make('span', '接续'))
      if (kinds.has('uses')) legend.append(make('span', '使用', 'uses'))
      content.replaceChildren(map, legend)
      drawRelations()
    }

    function drawRelations() {
      if (mode !== 'relations') return
      const canvas = by('relations-content').querySelector('canvas')
      if (!canvas) return
      const layer = canvasLayer(canvas)
      if (!layer) return
      const { box, pen } = layer
      const center = by('relations-content').querySelector('.relations-current').getBoundingClientRect()
      for (const direction of ['in', 'out']) {
        const entries = [...by('relations-content').querySelectorAll('[data-direction="' + direction + '"]')]
        entries.forEach((entry, index) => {
          const rect = entry.getBoundingClientRect()
          const cardY = (rect.top + rect.bottom) / 2 - box.top
          const centerY = center.top - box.top + center.height * (index + 1) / (entries.length + 1)
          const incoming = direction === 'in'
          const x1 = (incoming ? rect.right : center.right) - box.left
          const x2 = (incoming ? center.left : rect.left) - box.left - 1
          const y1 = incoming ? cardY : centerY, y2 = incoming ? centerY : cardY
          const bend = (x1 + x2) / 2
          pen.strokeStyle = pen.fillStyle = getComputedStyle(entry.firstElementChild).color
          pen.lineWidth = 1.6
          pen.setLineDash(entry.dataset.kind === 'uses' ? [4, 3] : [])
          pen.beginPath()
          pen.moveTo(x1, y1)
          pen.bezierCurveTo(bend, y1, bend, y2, x2 - 5, y2)
          pen.stroke()
          pen.beginPath()
          pen.moveTo(x2, y2)
          pen.lineTo(x2 - 6, y2 - 3)
          pen.lineTo(x2 - 6, y2 + 3)
          pen.fill()
        })
      }
    }

    function advance(edge) {
      guide.edges.push(edge)
      showStep(edge.to)
      by('guide-status').focus({ preventScroll: true })
    }

    function pickStep(id) {
      if (!guide) return showStep(id)
      const possible = current.flow.edges.filter(edge => edge.from === selected && edge.to === id)
      if (possible.length === 1) advance(possible[0])
      if (possible.length > 1) by('guide-choices').querySelector('button')?.focus()
    }

    function renderGuide() {
      const toggle = by('guide-toggle'), back = by('guide-back'), choices = by('guide-choices'), status = by('guide-status')
      toggle.textContent = guide ? '结束导览' : '从这一步开始导览'
      toggle.setAttribute('aria-pressed', Boolean(guide))
      const next = guide ? current.flow.edges.filter(edge => edge.from === selected) : []
      const canGoTo = new Set(next.map(edge => edge.to))
      const visited = new Set(guide ? [guide.start, ...guide.edges.map(edge => edge.to)] : [])
      for (const [id, card] of cards) {
        card.disabled = Boolean(guide) && id !== selected && !canGoTo.has(id)
        card.classList.toggle('on-route', visited.has(id))
        card.classList.toggle('next-step', canGoTo.has(id))
      }
      back.hidden = !guide
      back.disabled = !guide?.edges.length
      status.textContent = guide ? '已走 ' + (guide.edges.length + 1) + ' 步 · ' +
        (next.length ? '选择接下来的一步' : '已到达结束步骤') : ''
      choices.hidden = !next.length
      choices.replaceChildren(...next.map(edge => {
        const title = current.flow.nodes.find(node => node.id === edge.to).title
        const condition = edge.label ?? (edge.kind === 'branch' ? '条件未记录' : '')
        return button((condition ? condition + ' → ' : '前往 ') + title, 'guide-control', () => advance(edge))
      }))
    }

    const stepsByDocument = new Map()
    for (const group of data.groups) {
      for (const flow of group.flows) {
        for (const node of flow.nodes) {
          for (const path of new Set(node.sources.filter(source => source.kind === 'documentation' && !source.status).map(source => source.path))) {
            if (!stepsByDocument.has(path)) stepsByDocument.set(path, [])
            stepsByDocument.get(path).push({ key: group.id + '/' + flow.id + '/' + node.id, title: flow.title + ' · ' + node.title })
          }
        }
      }
    }

    function sourceSymbol(symbol) {
      const label = { call: '调用处', import: '导入处' }[symbol.kind] ?? '源码符号'
      return label + ' ' + symbol.name
    }

    function showSource(source, trigger) {
      const fields = make('dl', '', 'source-fields')
      const entries = [['路径', source.path], ['位置', source.line ? '第 ' + source.line + ' 行' : '文件级'],
        ['类型', kinds[source.kind]], ['锚点', source.anchored ? '行指纹已记录' : '未记录行指纹']]
      if (source.symbol) entries.splice(3, 0, ['符号', sourceSymbol(source.symbol)])
      for (const [label, value] of entries) fields.append(make('dt', label), make('dd', value))
      const content = [fields]
      if (source.status === 'needs-review') content.push(make('p', '证据待复核，请重新确认源码位置。', 'muted'))
      if (source.preview) {
        const { startLine, text } = source.preview
        const lines = text.split('\n')
        const digits = String(startLine + lines.length - 1).length
        const excerpt = lines.map((line, index) => String(startLine + index).padStart(digits) + '  ' + line)
        const preview = make('pre', excerpt.join('\n'), 'evidence-preview')
        preview.tabIndex = 0
        content.push(make('h3', '源码片段'), preview)
      } else content.push(make('p', '暂无源码片段', 'muted'))
      openReaderDialog('源码卡片', trigger, ...content)
    }

    function renderEvidence(node, title, references, offset = 0) {
      if (!references.length) return
      const list = make('ul', '', 'refs')
      for (const [index, source] of references.entries()) {
        const row = make('li')
        const location = make('div', '', 'evidence-row')
        const number = 'SRC ' + (offset + index + 1)
        const path = source.path + (source.line ? ':' + source.line : '')
        const badge = button(number, 'source-badge', event => showSource(source, event.currentTarget))
        badge.setAttribute('aria-label', number + ' · 查看源码卡片 · ' + path)
        badge.setAttribute('aria-haspopup', 'dialog')
        badge.setAttribute('aria-controls', 'reader-dialog')
        const label = make('span')
        label.append(make('code', path), ' · ' + kinds[source.kind])
        if (source.symbol) label.append(' · ' + sourceSymbol(source.symbol))
        if (source.status === 'needs-review') label.append(make('span', ' · 证据待复核', 'muted'))
        location.append(badge, label)
        row.append(location)
        if (source.kind === 'documentation' && !source.status) {
          const others = (stepsByDocument.get(source.path) ?? []).filter(step => step.key !== current.key + '/' + node.id)
          const related = others.slice(0, 5).map(step => {
            const link = make('a', step.title, 'relation')
            link.href = '#step/' + step.key
            return link
          })
          if (related.length) row.append(make('p', '也引用此文档的步骤', 'muted'), ...related)
        }
        list.append(row)
      }
      detail.append(make('h3', title), list)
    }

    function showStep(id) {
      const { flow } = current
      const node = flow.nodes.find(item => item.id === id)
      selected = id
      selectedByFlow.set(current.key, id)
      hideTooltip()
      for (const [key, card] of cards) card.setAttribute('aria-pressed', key === id)
      renderGuide()
      detail.replaceChildren(reviewText('h2', node.title, id), stepBadge(node), reviewText('p', node.summary, id))
      renderVerification(node)
      if (node.details.length) {
        const list = make('ul')
        list.append(...node.details.map(value => reviewText('li', value, id)))
        detail.append(make('h3', '实现说明'), list)
      }
      const codeSources = node.sources.filter(source => source.kind !== 'documentation')
      renderEvidence(node, '源码与测试', codeSources)
      renderEvidence(node, '相关文档', node.sources.filter(source => source.kind === 'documentation'), codeSources.length)
      if (data.documentRoot || data.review) {
        const link = make('a', '在项目文档中查看这一步 →', 'relation')
        const documentHref = data.review
          ? '?' + new URLSearchParams({ workspace: data.review.workspace, doc: current.group.id })
          : data.documentRoot + current.group.id + '.html'
        link.href = documentHref + '#' + flow.id + '--' + node.id
        detail.append(link)
      }
      function adjacent(title, edges, key) {
        if (!edges.length) return
        detail.append(make('h3', title))
        for (const edge of edges) {
          const target = flow.nodes.find(item => item.id === edge[key])
          const label = edge.label ? target.title + ' · ' + edge.label : target.title
          detail.append(button(label, 'relation', () => {
            showStep(target.id)
            cards.get(target.id).focus()
          }))
        }
      }
      if (!guide) {
        adjacent('接下来', flow.edges.filter(edge => edge.from === id), 'to')
        adjacent('前一步', flow.edges.filter(edge => edge.to === id), 'from')
      }
      const { incoming, outgoing } = connections.get(current.key)
      if (incoming.length || outgoing.length) {
        detail.append(make('h3', '跨线路关系'),
          button('查看 ' + (incoming.length + outgoing.length) + ' 条关系 →', 'relation', () => activate('relations', current, true)))
      }
      if (data.review) {
        const draftLink = make('a', '在草稿中批注这一步 →', 'relation')
        draftLink.href = '?' + new URLSearchParams({
          workspace: data.review.workspace, drafts: '1', group: current.group.id, flow: flow.id, step: id,
        })
        detail.append(draftLink)
      }
      draw()
    }

    function draw() {
      if (mode !== 'process') return
      const rect = graph.getBoundingClientRect()
      const scale = Number(getComputedStyle(graph).getPropertyValue('--process-scale')) || 1
      const walked = new Set(guide?.edges)
      wires.replaceChildren()
      current.flow.edges.forEach((edge, i) => {
        const a = cards.get(edge.from).getBoundingClientRect(), b = cards.get(edge.to).getBoundingClientRect()
        const x1 = ((a.left + a.right) / 2 - rect.left) / scale, x2 = ((b.left + b.right) / 2 - rect.left) / scale
        const y1 = (a.bottom - rect.top) / scale, y2 = (b.top - rect.top) / scale - 4
        const reverse = y2 <= y1
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        if (reverse) {
          const side = 8 + (i % 3) * 4
          const ax = (a.left - rect.left) / scale, bx = (b.left - rect.left) / scale - 4
          const ay = ((a.top + a.bottom) / 2 - rect.top) / scale, by = ((b.top + b.bottom) / 2 - rect.top) / scale
          path.setAttribute('d', ['M', ax, ay, 'H', side, 'V', by, 'H', bx].join(' '))
        } else {
          const middle = (y1 + y2) / 2
          path.setAttribute('d', ['M', x1, y1, 'V', middle, 'H', x2, 'V', y2].join(' '))
        }
        const classes = ['wire']
        if (reverse) classes.push('return-edge')
        if (walked.has(edge)) classes.push('walked')
        else if (edge.from === selected || (!guide && edge.to === selected)) classes.push('selected')
        else if (guide) classes.push('outside')
        path.setAttribute('class', classes.join(' '))
        path.setAttribute('marker-end', 'url(#arrow)')
        wires.append(path)
      })
    }

    function resetProcessSize() {
      processFitted = false
      fitProcess.textContent = '适应窗口'
      graph.style.removeProperty('--process-scale')
      processViewport.style.height = ''
    }

    function fitProcessToWindow(scroll = true) {
      resetProcessSize()
      const { height } = graph.getBoundingClientRect()
      const scale = Math.min(1, Math.max(1, innerHeight - 24) / height)
      if (scale < 1) {
        processFitted = true
        fitProcess.textContent = '恢复原大小'
        graph.style.setProperty('--process-scale', String(scale))
        processViewport.style.height = Math.ceil(height * scale) + 'px'
      }
      draw()
      if (scroll) processViewport.scrollIntoView({ block: 'start', inline: 'nearest' })
    }

    function renderProcess() {
      const { group, flow } = current
      by('process-group').textContent = group.title
      withTerms(by('title'), flow.title)
      withTerms(by('summary'), flow.summary)
      cards.clear()
      lanes.replaceChildren()
      const hasPredecessor = new Set(flow.edges.map(edge => edge.to))
      const hasSuccessor = new Set(flow.edges.map(edge => edge.from))
      const branchPoints = new Set(flow.edges.filter(edge => edge.kind === 'branch').map(edge => edge.from))
      for (const row of flow.layout.rows) {
        const lane = make('div', '', 'lane')
        for (const id of row) {
          const node = flow.nodes.find(step => step.id === id)
          const card = button('', 'step', () => pickStep(id))
          const entry = !hasPredecessor.has(id), exit = !hasSuccessor.has(id)
          if (branchPoints.has(id)) card.append(make('span', entry ? '起点 · 分岔' : '分岔', 'step-role branch'))
          else if (entry || exit) card.append(make('span', entry && exit ? '单步流程' : entry ? '起点' : '结束', 'step-role ' + (entry ? 'entry' : 'end')))
          const conditions = flow.edges.filter(edge => edge.to === id && edge.kind === 'branch' && edge.label)
          if (conditions.length === 1) card.append(make('span', conditions[0].label, 'condition'))
          const title = make('strong', node.title), summary = make('span', node.summary)
          if (data.review) card.dataset.reviewStep = title.dataset.reviewText = summary.dataset.reviewText = id
          card.append(title, summary, stepBadge(node))
          cards.set(id, card)
          lane.append(card)
        }
        lanes.append(lane)
      }
      const entry = flow.layout.rows.flat().find(id => !hasPredecessor.has(id))
      showStep(selectedByFlow.get(current.key) ?? entry ?? flow.layout.rows[0][0])
    }

    function activate(view, item, focusHeading = false, writeHistory = true, step) {
      if (processFitted) resetProcessSize()
      mode = view
      current = item
      if (step) selectedByFlow.set(item.key, step)
      if (guide && (step || guide.key !== current.key)) guide = null
      hideTooltip()
      by('workspace').dataset.view = document.body.dataset.view = mode
      by('overview-panel').hidden = mode !== 'overview'
      if (mode === 'overview' && !overviewRoot) renderOverview(true)
      exportPng.disabled = mode !== 'overview' || !overviewCards.size
      by('process-panel').hidden = detail.hidden = mode !== 'process'
      by('relations-panel').hidden = mode !== 'relations'
      by('navigation').hidden = mode === 'overview'
      for (const control of viewButtons) {
        if (control.dataset.view === mode) control.setAttribute('aria-current', 'page')
        else control.removeAttribute('aria-current')
      }
      if (mode !== 'overview') navigation()
      if (mode === 'process') renderProcess()
      if (mode === 'relations') renderRelations()
      if (mode !== 'overview' && narrow.matches) by('navigator').open = false
      const hash = step ? 'step/' + item.key + '/' + step
        : mode === 'overview' ? 'overview' : (mode === 'relations' ? 'relations/' : '') + item.key
      if (writeHistory && location.hash !== '#' + hash) history.pushState(null, '', '#' + hash)
      if (focusHeading) {
        const heading = by(mode === 'process' ? 'title' : 'relations-title')
        heading.tabIndex = -1
        heading.focus()
      }
    }

    function restoreView() {
      const hash = location.hash.slice(1)
      const step = /^step\/([^/]+)\/([^/]+)\/([^/]+)$/.exec(hash)
      const processItem = itemByKey.get(step ? step[1] + '/' + step[2] : hash)
      const relationItem = hash.startsWith('relations/') && itemByKey.get(hash.slice('relations/'.length))
      if (processItem) {
        if (step && processItem.flow.nodes.some(node => node.id === step[3])) selectedByFlow.set(processItem.key, step[3])
        activate('process', processItem, false, false)
      }
      else if (relationItem) activate('relations', relationItem, false, false)
      else activate('overview', current, false, false)
    }

    overviewSearch.addEventListener('input', () => renderOverview(true))
    overviewMap.addEventListener('focusin', event => focusOverviewWires(event.target))
    overviewMap.addEventListener('focusout', event => focusOverviewWires(event.relatedTarget))
    overviewMap.addEventListener('keydown', navigateOverview)
    for (const control of viewButtons) {
      control.addEventListener('click', () => activate(control.dataset.view, current))
    }
    by('navigator').open = !narrow.matches
    narrow.addEventListener('change', event => { by('navigator').open = !event.matches })
    window.addEventListener('hashchange', restoreView)
    by('search').addEventListener('input', navigation)
    shortcutHelp.addEventListener('click', () => showShortcuts(shortcutHelp))
    dialogClose.addEventListener('click', () => readerDialog.close())
    readerDialog.addEventListener('click', event => {
      if (event.target !== readerDialog) return
      const { left, right, top, bottom } = readerDialog.getBoundingClientRect()
      if (event.clientX < left || event.clientX > right || event.clientY < top || event.clientY > bottom) readerDialog.close()
    })
    readerDialog.addEventListener('close', () => {
      if (!readerDialog.open) {
        const trigger = dialogTrigger?.isConnected ? dialogTrigger : shortcutHelp
        dialogTrigger = undefined
        trigger.focus({ preventScroll: true })
      }
    })
    fitProcess.addEventListener('click', () => {
      if (processFitted) {
        resetProcessSize()
        draw()
      } else fitProcessToWindow()
    })
    const closeExportOptions = () => {
      exportOptions.open = false
      by('export-toggle').focus()
    }
    exportOptions.addEventListener('keydown', event => {
      if (event.key === 'Escape' && exportOptions.open) {
        event.preventDefault()
        closeExportOptions()
      }
    })
    exportPng.addEventListener('click', () => {
      closeExportOptions()
      void exportTopology()
    })
    by('print-view').addEventListener('click', () => {
      closeExportOptions()
      window.print()
    })
    window.addEventListener('beforeprint', () => {
      if (mode === 'overview') by('print-topology').innerHTML = serializeTopology()?.svg ?? ''
      draw()
      drawRelations()
    })
    window.addEventListener('afterprint', () => { by('print-topology').replaceChildren() })
    by('guide-toggle').addEventListener('click', () => {
      guide = guide ? null : { key: current.key, start: selected, edges: [] }
      showStep(selected)
    })
    by('guide-back').addEventListener('click', () => {
      const edge = guide.edges.pop()
      showStep(edge.from)
      by('guide-status').focus({ preventScroll: true })
    })
    try { beginner.checked = localStorage.getItem('threadlight-beginner') === 'on' } catch {}
    beginner.addEventListener('change', () => {
      try { localStorage.setItem('threadlight-beginner', beginner.checked ? 'on' : 'off') } catch {}
      if (mode !== 'process') return
      withTerms(by('title'), current.flow.title)
      withTerms(by('summary'), current.flow.summary)
      showStep(selected)
    })
    tooltip.addEventListener('pointerenter', () => clearTimeout(closeTimer))
    tooltip.addEventListener('pointerleave', scheduleTooltipClose)
    document.addEventListener('pointerdown', event => {
      if (activeTerm && !activeTerm.contains(event.target) && !tooltip.contains(event.target)) hideTooltip()
    })
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && activeTerm) hideTooltip()
      handleShortcuts(event)
    })
    window.addEventListener('resize', () => {
      positionTooltip()
      if (processFitted) fitProcessToWindow(false)
    })
    window.addEventListener('scroll', positionTooltip)
    restoreView()
    new ResizeObserver(draw).observe(graph)
    new ResizeObserver(drawRelations).observe(by('relations-content'))
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawRelations)
    if (data.review) window.ThreadlightReview.mount(data, scope => {
      const overviewKey = scope?.closest('[data-overview-flow]')?.dataset.overviewFlow
      return itemByKey.get(overviewKey) ?? current
    })
  </script>
</body>
</html>
