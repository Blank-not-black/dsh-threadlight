<!doctype html>
<html lang="zh-CN" data-page="intro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Threadlight</title>
  <link rel="stylesheet" href="launch.css">
  <script src="launch.js"></script>
</head>
<body>
  <main class="launcher">
    <h1 class="brand">Threadlight</h1>
    <div class="choices">
      <section class="choice see" aria-labelledby="see-title">
        <div class="choice-content">
          <span class="entry-line" aria-hidden="true"></span>
          <h2 id="see-title" lang="en"><strong>See</strong> <span>how it works.</span></h2>
          <a class="entry-button" id="open-create" href="?view=create">创建新工作区 <span aria-hidden="true">↗</span></a>
        </div>
      </section>
      <section class="choice shape" aria-labelledby="shape-title">
        <div class="choice-content">
          <span class="entry-line" aria-hidden="true"></span>
          <h2 id="shape-title" lang="en"><strong>Shape</strong> <span>what comes next.</span></h2>
          <a class="entry-button" id="open-existing" href="?view=workspaces">进入已有工作区 <span aria-hidden="true">↗</span></a>
        </div>
      </section>
    </div>
    <div class="opening" aria-hidden="true"><span>Threadlight</span><i></i></div>
  </main>
</body>
</html>
