<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>批注箱 · Threadlight</title>
  <link rel="stylesheet" href="notes.css">
  <script id="notes-context" type="application/json">"THREADLIGHT_NOTES_CONTEXT"</script>
  <script src="notes.js" defer></script>
</head>
<body>
  <header>
    <div>
      <p id="project"></p>
      <h1>批注箱 <span id="total"></span></h1>
    </div>
    <a id="return" href="./">返回图谱</a>
  </header>
  <main id="notes" aria-label="项目批注">
    <p id="empty" hidden>这个项目还没有批注。<a id="empty-return" href="./">返回图谱</a></p>
    <div id="groups"></div>
  </main>
  <footer>
    <p id="status" role="status">正在读取批注…</p>
    <div class="submit-actions">
      <span id="selected">已选 0 条</span>
      <button type="button" id="submit" disabled>提交给 DSH</button>
    </div>
  </footer>
</body>
</html>
