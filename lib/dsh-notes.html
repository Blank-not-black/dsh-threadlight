<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>批注箱 · Threadlight</title>
  <link rel="stylesheet" href="notes.css">
  <script id="notes-context" type="application/json">"THREADLIGHT_NOTES_CONTEXT"</script>
  <script src="notes.js" defer></script>
</head>
<body class="dsh-notes">
  <header>
    <div>
      <p id="project"></p>
      <h1>批注箱 <span id="total"></span></h1>
    </div>
    <a id="return" class="dsh-link" href="./">返回图谱</a>
  </header>
  <main id="notes" aria-label="项目批注">
    <section id="empty" class="empty-state" hidden>
      <h2 id="empty-title">这个项目还没有批注</h2>
      <p id="empty-hint">在查看器里右键模块或步骤，或选中一段文字后批注。批注可以直接提交给 DSH，不需要先改流程图。</p>
      <div class="empty-actions">
        <a id="empty-return" class="dsh-link" href="./">返回图谱</a>
      </div>
    </section>
    <div id="groups"></div>
  </main>
  <footer>
    <p id="status" role="status">正在读取批注…</p>
    <div class="submit-actions">
      <span id="selected">已选 0 条</span>
      <button type="button" id="submit" class="primary" disabled>提交给 DSH</button>
    </div>
    <div id="failures" class="failures" role="alert" hidden></div>
  </footer>
</body>
</html>
